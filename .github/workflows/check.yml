name: Check workspace

on:
  pull_request:
  push:
    branches:
      - refactor/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build:web:fixture
      - run: npm run build -w @icaros/cms
      - run: npm run build -w @icaros/api
